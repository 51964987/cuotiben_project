<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}错题本{% endblock %}</title>
<link rel="stylesheet" href="/static/css/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"
  onload="renderMathInElement(document.body,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false},{left:'\\(',right:'\\)',display:false}],throwOnError:false});"></script>
</head>
<body>
<nav class="topnav no-print">
  <a href="/" class="brand">错题本</a>
  <a href="/upload">拍照录入</a>
  <a href="/questions">题库</a>
  <a href="/paper/new">组卷</a>
  <a href="/papers">试卷</a>
  <a href="/settings">设置</a>
</nav>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
